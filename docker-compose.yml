# Скелет окружения doctj (ADR 0006, 0007).
# Доменная логика сервисов — заглушки; здесь только инфраструктура и каркас.

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_started

services:
  # --- Gateway (ADR 0006): Traefik, маршрутизация по PathPrefix /api/<сервис> ---
  # Роуты — статикой в infra/traefik/dynamic.yml (file provider). Раньше
  # пробовали docker provider по лейблам, но в Docker Desktop+WSL2 Traefik
  # не читал docker.sock; file provider развязывает это намертво.
  gateway:
    image: traefik:v3.1
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped

  # --- Инфраструктура ---
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # --- Сервисы (ADR 0006) ---
  # Лейблов для Traefik больше нет: маршруты прописаны в dynamic.yml,
  # сервисы адресуются по docker-DNS имени в сети doctj_default.
  identity:
    <<: *service-defaults
    build: ./services/identity

  content:
    <<: *service-defaults
    build: ./services/content
    # JSON-схемы и примеры монтируем read-only, чтобы seed мог их грузить
    # одной командой: `docker compose exec content python -m app.seed /schemas/examples`.
    volumes:
      - ./schemas:/schemas:ro

  simulation:
    <<: *service-defaults
    build: ./services/simulation

  patient-llm:
    <<: *service-defaults
    build: ./services/patient-llm

  evaluation:
    <<: *service-defaults
    build: ./services/evaluation

  llm-gateway:
    <<: *service-defaults
    build: ./services/llm-gateway

volumes:
  pgdata:
